[package]
name = "rta-fuzz"
version = "0.0.0"
edition = "2021"
description = "cargo-fuzz targets for the host's untrusted-input parsers. Not flight code."
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
rta-host = { path = "../crates/rta-host" }

# Its own workspace: the fuzz crate needs nightly and libFuzzer, and stays out of the
# pinned-toolchain workspace build and `cargo deny`.
[workspace]
members = ["."]

[[bin]]
name = "read_apply"
path = "fuzz_targets/read_apply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mavlink_frames"
path = "fuzz_targets/mavlink_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false
