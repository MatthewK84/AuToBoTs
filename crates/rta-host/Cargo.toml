[package]
name = "rta-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Host binary. Must not construct an outbound command; the switch does that."
license = "Apache-2.0"

[[bin]]
name = "rta-host"
path = "src/main.rs"

[dependencies]
sha2 = { version = "0.10", default-features = false }
rta-spec = { path = "../rta-spec", version = "0.1.0" }
rta-switch = { path = "../rta-switch", version = "0.1.0" }
rta-filter = { path = "../rta-filter", version = "0.1.0" }
rtlola-interpreter = "=0.11.0"
rtlola-frontend = "=0.8.0"
mavlink = { version = "=0.18.0", default-features = false, features = ["std", "serde", "dialect-common", "transport-udp", "transport-direct-serial"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ordered-float = "=3.9.2"
ctrlc = "=3.5.2"

[[bin]]
name = "rta-sitl"
path = "src/bin/rta-sitl.rs"

[[bin]]
name = "rta-trips"
path = "src/bin/rta-trips.rs"

[[bin]]
name = "rta-target"
path = "src/bin/rta-target.rs"

[dev-dependencies]
# Property tests only. No fork, no file persistence: a fixed seed in each test keeps runs
# deterministic (tests/properties.rs).
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
