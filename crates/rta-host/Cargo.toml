[package]
name = "rta-host"
version = "0.1.0"
edition = "2021"
description = "Host binary. Must not construct an outbound command; the switch does that."
license = "Apache-2.0"

[[bin]]
name = "rta-host"
path = "src/main.rs"

[dependencies]
rta-spec = { path = "../rta-spec" }
rta-switch = { path = "../rta-switch" }
