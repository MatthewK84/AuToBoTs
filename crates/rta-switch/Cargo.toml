[package]
name = "rta-switch"
version = "0.1.0"
edition = "2021"
description = "Fail-closed command decision. No interpreter, no MAVLink, no release path."
license = "Apache-2.0"

[dependencies]
rta-spec = { path = "../rta-spec", version = "0.1.0" }

[features]
default = []
verify = ["dep:kani-verifier"]

[dependencies.kani-verifier]
version = "=0.68.0"
optional = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
