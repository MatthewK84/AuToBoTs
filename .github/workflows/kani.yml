name: kani
# Runs on pull requests too, so a harness change is proved before merge.
# It is still not a dependency of the ci workflow's close-named-issue job.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
      - name: Install the pinned Kani solver
        run: cargo install --locked kani-verifier --version 0.68.0
      - name: Set up Kani
        run: cargo kani setup
      - name: Prove the switch harness
        run: cargo kani -p rta-switch
