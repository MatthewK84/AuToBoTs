name: ci
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require SBOM and provenance on tags
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            sh scripts/evidence.sh
          else
            echo "evidence job skipped off tag; tag builds fail closed"
          fi

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  close-named-issue:
    needs: [compile, deny, evidence]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Close the issue named in the commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          msg=$(git log -1 --format=%B)
          num=$(printf '%s\n' "$msg" | sed -n 's/.*Issue: #\?\([0-9][0-9]*\).*/\1/p' | head -n 1)
          if [ -z "$num" ]; then
            echo "no Issue: line; nothing to close"
            exit 0
          fi
          gh issue close "$num" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Closed after CI passed on ${GITHUB_SHA}."
