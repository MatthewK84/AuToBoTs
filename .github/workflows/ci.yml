name: ci
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Every job reads the repository and nothing else unless it says so (docs/ci.md).
permissions:
  contents: read
# Every action is pinned to a full commit SHA. The comment names the release it was taken
# from; update the SHA and the comment together.
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo run --locked -q -p rta-host --bin rta-replay -- crates/rta-host/fixtures/golden spec/monitor.lola
      - name: Switch does not depend on the tracker
        run: |
          grep -q 'rta-tracker' crates/rta-switch/Cargo.toml && echo "switch depends on tracker" && exit 1 || true
      - name: Hazard change gate
        run: |
          CHANGED=$(git diff --name-only HEAD~1 || true)
          echo "$CHANGED" | grep -qE 'docs/safety-method.md|docs/hazards.md' && ! echo "$CHANGED" | grep -q 'docs/spec-notes.md' && echo "hazard change without notes" && exit 1 || true
      - name: Spec change gate
        run: |
          CHANGED=$(git diff --name-only HEAD~1 || true)
          echo "$CHANGED" | grep -q 'spec/monitor.lola' && ! echo "$CHANGED" | grep -q 'docs/spec-notes.md' && echo "spec change without notes" && exit 1 || true

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
      # The flight build: release profile, panic = "abort" (docs/panics.md).
      - run: cargo build --locked --release --workspace

  aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          targets: aarch64-unknown-linux-gnu
      # libc6-dev-arm64-cross holds the target glibc and crt files (Scrt1.o). It is only a
      # Recommends of the cross gcc, so --no-install-recommends needs it named.
      - name: Install the aarch64 linker and target libc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      # The Jetson target triple. A cross-build check, not a run on the board (docs/target.md).
      - name: Cross-build the release binaries for aarch64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --workspace --target aarch64-unknown-linux-gnu

  target-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install the aarch64 linker, target libc and qemu user mode
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      # A smoke run of the simulated-timing path: it builds, runs under qemu-aarch64 and the
      # host model, and labels its output simulated. Runner timing is not evidence either way
      # (docs/target-timing.md).
      - name: Simulated target timing smoke
        env:
          TICKS: "200"
          MODE: tight
          OUT_DIR: target-sim
          ALLOW_OVER: "1"
        run: bash scripts/target-sim.sh qemu host-sim
      - name: Every artifact is labelled simulated
        run: |
          for file in target-sim/qemu-aarch64.txt target-sim/host-sim.txt; do
            grep -q '^# SIMULATED' "$file"
            grep -q '^evidence=simulated ' "$file"
          done

  px4-sitl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # One explicit, minimal install of the pinned toolchain. The script builds with
      # RUSTUP_TOOLCHAIN set, so rustup adds no rust-toolchain.toml components (rustfmt and
      # clippy are not needed here), and nothing can collide with the runner's own cargo-fmt.
      - name: Install the pinned Rust toolchain (minimal)
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustup default 1.98.1
      - name: Install the PX4 SITL build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build python3-venv python3-dev
      # Real PX4 v1.16.2 software in the loop, SIH model, headless: clone, build, and the
      # scenarios in docs/sitl.md. Not hardware.
      - name: rta-host against PX4 SITL
        env:
          OUT_DIR: sitl-px4
        run: bash scripts/sitl-px4.sh

  sitl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
      # The stand-in peer, not PX4: PX4_DIR is unset on the runner (docs/sitl.md).
      - name: SITL trips against the stand-in
        run: bash scripts/sitl-trips.sh
      - name: SITL nominal hover against the stand-in
        run: bash scripts/sitl.sh

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require SBOM and provenance on tags
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            sh scripts/evidence.sh
          else
            echo "evidence job skipped off tag; tag builds fail closed"
          fi

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Closes the issue named by an `Issue: #N` line in the commit that landed on main, after
  # compile, deny, and evidence pass. Its token can write issues and read the repository;
  # nothing else. Whether to keep it at all is an owner decision (docs/ci.md).
  close-named-issue:
    needs: [compile, deny, evidence]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Close the issue named in the commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          msg=$(git log -1 --format=%B)
          num=$(printf '%s\n' "$msg" | sed -n 's/^Issue: #\?\([0-9][0-9]*\)[[:space:]]*$/\1/p' | head -n 1)
          if [ -z "$num" ]; then
            echo "no Issue: line; nothing to close"
            exit 0
          fi
          gh issue close "$num" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Closed after CI passed on ${GITHUB_SHA}."

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # cargo-fuzz needs nightly. A dated nightly, so the job is the same from run to run.
      # The `+toolchain` on each command leaves the pinned rust-toolchain.toml alone.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, input-driven
        with:
          toolchain: nightly-2026-10-18
      - run: cargo +nightly-2026-10-18 install cargo-fuzz --version 0.13.2 --locked
      - name: Run each fuzz target for a fixed count on a fixed seed
        run: |
          set -eu
          for target in read_apply mavlink_frames config_parse; do
            scratch=$(mktemp -d)
            cp fuzz/corpus/"$target"/* "$scratch"/
            cargo +nightly-2026-10-18 fuzz run "$target" "$scratch" -- -runs=200000 -seed=1
          done

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: llvm-tools-preview
      - run: bash scripts/coverage.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: switch-coverage
          path: target/coverage/
